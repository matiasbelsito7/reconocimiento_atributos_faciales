# Configuración de inferencia
# Archivo: config/inference.yaml

# Thresholds para predicciones binarias
thresholds:
  default: 0.5
  per_attribute:
    5_o_Clock_Shadow: 0.76
    Bald: 0.97
    Bangs: 0.92
    Black_Hair: 0.60
    Blond_Hair: 0.78
    Blurry: 0.94
    Brown_Hair: 0.74
    Eyeglasses: 0.92
    Goatee: 0.93
    Gray_Hair: 0.97
    Heavy_Makeup: 0.73
    Mouth_Slightly_Open: 0.57
    Mustache: 0.85
    No_Beard: 0.35
    Receding_Hairline: 0.84
    Sideburns: 0.93
    Smiling: 0.56
    Straight_Hair: 0.50
    Wavy_Hair: 0.71
    Wearing_Earrings: 0.82
    Wearing_Hat: 0.89
    Wearing_Lipstick: 0.74
    Wearing_Necklace: 0.81
    Wearing_Necktie: 0.90

  # Margen de incerteza por defecto (0.0 = sin incerteza)
  margin_default: 0.0
  # Márgenes por atributo estimados en validación. Cuando un score cae en
  # [umbral - margen, umbral + margen] la decisión es "incierto".
  margins_per_attribute:
    5_o_Clock_Shadow: 0.00
    Bald: 0.00
    Bangs: 0.00
    Black_Hair: 0.00
    Blond_Hair: 0.00
    Blurry: 0.03
    Brown_Hair: 0.09
    Eyeglasses: 0.00
    Goatee: 0.00
    Gray_Hair: 0.00
    Heavy_Makeup: 0.00
    Mouth_Slightly_Open: 0.00
    Mustache: 0.12
    No_Beard: 0.00
    Receding_Hairline: 0.07
    Sideburns: 0.00
    Smiling: 0.00
    Straight_Hair: 0.20
    Wavy_Hair: 0.00
    Wearing_Earrings: 0.00
    Wearing_Hat: 0.00
    Wearing_Lipstick: 0.00
    Wearing_Necklace: 0.17
    Wearing_Necktie: 0.00

face_detection:
  model: opencv_dnn  # opencv_dnn | mtcnn | retinaface
  confidence_threshold: 0.5
  nms_threshold: 0.4
  max_faces: 10
  model_path: models/face_detection/

# Configuración de face extraction
face_extraction:
  margin: 0.2
  largest_face_only: true
  target_size: [224, 224]

# Opciones de optimización
optimization:
  use_fp16: false
  batch_inference: false
  batch_size: 8

# Configuración de salida
output:
  format: json  # json | csv | dict
  include_bbox: true
  include_confidence: true
  include_attributes: true
  attribute_names: auto  # auto | list

# Configuración de inferencia
inference:
  device: auto
  model_path: checkpoints_40k_obs24/best_model.pt
  num_attributes: 24
