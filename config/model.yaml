# Configuración del modelo
# Archivo: config/model.yaml

# Arquitectura del modelo
architecture:
  name: facial_attribute_classifier
  backbone: resnet18  # resnet18 | resnet34 | resnet50
  pretrained: true
  num_attributes: 40

# Configuración de entrada
input:
  image_size: [224, 224]
  channels: 3
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

# Configuración de salida
output:
  activation: sigmoid
  threshold: 0.5

# Regularización
regularization:
  dropout: 0.5
  freeze_backbone: false
  freeze_layers: 0
