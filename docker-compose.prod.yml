services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/matiasbelsito7/reconocimiento_atributos_faciales/backend}:${IMAGE_TAG:-latest}
    ports:
      - "8000:8000"
    volumes:
      - ./checkpoints:/app/checkpoints:ro
      - ./models:/app/models:ro
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/matiasbelsito7/reconocimiento_atributos_faciales/frontend}:${IMAGE_TAG:-latest}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
